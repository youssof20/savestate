name: Release Lite

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version and build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os, sys; sys.path.insert(0, "tools"); from build_release import version; assert os.environ["TAG"] == "v" + version(), "Tag and plugin version differ"'
          python tools/build_release.py
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip dist/*.sha256 --verify-tag --title "SaveState Lite $TAG" --notes-file CHANGELOG.md
